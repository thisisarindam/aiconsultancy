 for the automation to function. All API keys and credentials are managed through secure vaults."},{question:"What tools and platforms do you work with?",answer:"We're platform-agnostic and integrate with virtually anything that has an API. Common platforms include Salesforce, HubSpot, Slack, Microsoft Teams, Google Workspace, Office 365, QuickBooks, Xero, Shopify, WooCommerce, Zendesk, Jira, Asana, Monday.com, Tally, Zoho, and hundreds more. We also build custom API connectors when needed."},{question:"Is there a guarantee on your work?",answer:"Absolutely. We offer a 100% ROI guarantee: if our automation doesn't pay for itself within 6 months of deployment, we'll work with you at no additional cost until it does — or refund the difference. We're that confident in our work. Our average client sees a 5-10x return within the first year."},{question:"How is MODUS different from hiring a traditional consultant?",answer:"Traditional consultants charge ₹5,000-15,000/hour for analysis alone and often deliver slide decks without implementation. We charge a one-time project fee that includes discovery, building, deployment, AND training — all at roughly 40-60% less than a traditional consulting engagement. Plus, you get working automation, not just recommendations."},{question:"Can you work with our existing IT team?",answer:"We prefer it! We're designed to complement your existing team, not replace them. We handle the AI/automation heavy lifting while working closely with your IT staff to ensure everything integrates seamlessly with your existing infrastructure and security policies."}];function uw(){const[i,s]=V.useState(null),l=r=>{s(i===r?null:r)};return h.jsx("section",{id:"faq",className:"relative py-20 sm:py-24 px-4",children:h.jsxs("div",{className:"max-w-3xl mx-auto",children:[h.jsxs(J.div,{initial:{opacity:0,y:30},whileInView:{opacity:1,y:0},viewport:{once:!0,margin:"-80px"},transition:{duration:.6},className:"text-center mb-10 sm:mb-14",children:[h.jsxs("div",{cl
